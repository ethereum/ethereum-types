name: Wheels

on:
  push:
    branches:
      - master
  workflow_dispatch:
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compiled:
    name: "Compiled Wheels (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - "ubuntu-latest"
          - "ubuntu-24.04-arm"
          - "macos-latest"
          - "windows-latest"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and Test Wheels
        uses: pypa/cibuildwheel@v4.3.1

      - name: Upload Wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  pure:
    name: "Pure Python Wheel and Source Distribution"
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Hatch
        run: "pip install hatch==1.16.5"

      - name: Build
        run: hatch build

      - name: Upload Distributions
        uses: actions/upload-artifact@v4
        with:
          name: pure
          path: dist/*

  publish:
    name: "Publish to PyPI"
    if: github.event_name == 'release'
    needs: [compiled, pure]
    runs-on: "ubuntu-latest"
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download Distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
